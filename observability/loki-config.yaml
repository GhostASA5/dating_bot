auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-active
    cache_location: /loki/boltdb-cache
    cache_ttl: 24h
    shared_store: filesystem

limits_config:
  retention_period: 48h
  allow_structured_metadata: false
  # Promtail can ship old lines from long-lived containers; default reject causes HTTP 400.
  reject_old_samples: false

ruler:
  alertmanager_url: http://localhost:9093
